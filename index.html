function talkLine(c,b){const pool=Math.random()<.35?TALK[c.cat]:TALK[b.type];return pick(pool).replace(/\{T\}/g,"$"+c.ticker)}
function botChat(c,b,now=Date.now()){c.chat.unshift({who:b.name,type:b.type,text:talkLine(c,b),t:now});if(c.chat.length>60)c.chat.length=60}

/* ---------- launching ---------- */
function launchCoin(o,quiet){
  const c=newCoin(o);if(!c.moment)c.moment=c.id;S.coins.push(c);
  if(!quiet)S.lastLaunch={id:c.id,ticker:c.ticker,who:c.creator,t:c.created};
  if(o.firstBuy>0){if(o.isUser)S.user.cash-=o.firstBuy;doBuy(c,o.creator,o.firstBuy,c.created+1,true)}
  prune();return c;
}
function prune(){
  if(S.coins.length<=42)return;const now=Date.now();
  const dead=S.coins.filter(c=>!c.isUser&&!c.grad&&!(c.holders.you)&&c.id!==UI.coinId).sort((a,b)=>heat(a,now)-heat(b,now));
  while(S.coins.length>42&&dead.length){const d=dead.shift();S.coins.splice(S.coins.indexOf(d),1)}
}
function rivalTicker(t){return pick([t+"2","REAL"+t,t+"X","THE"+t,t+"OG"]).slice(0,10)}
function botLaunch(now){
  const live=new Set(S.coins.map(c=>c.artKey||c.ticker));
  const pool=BOT_LAUNCHES.filter(t=>!live.has(t.artKey||t.ticker));const tpl=pick(pool.length?pool:BOT_LAUNCHES);
  let ticker=tpl.ticker;if(S.coins.some(c=>c.ticker===ticker))ticker=rivalTicker(ticker);
  const b=pick(S.bots);
  launchCoin({...tpl,artKey:tpl.artKey||tpl.ticker,ticker,moment:tpl.moment||"m_"+(tpl.artKey||tpl.ticker),pat:pick(Object.keys(PATS)),pal:pick(Object.keys(PALS)),creator:b.name,created:now,fate:rand(.15,.95),firstBuy:rand(20,80)});
}
function rivalLaunch(orig){
  if(!S.coins.includes(orig))return;
  const b=pick(S.bots.filter(x=>x.type==="sniper"||x.type==="hype"));
  const c=launchCoin({ticker:rivalTicker(orig.ticker),name:orig.name,line:orig.line,sport:orig.sport,cat:orig.cat,tags:orig.tags,art:orig.art,artKey:orig.artKey,play:orig.play,sb:orig.sb,clock:orig.clock,date:orig.date,stat:orig.stat,thesis:orig.thesis,pat:pick(Object.keys(PATS)),pal:pick(Object.keys(PALS)),creator:b.name,created:Date.now(),fate:rand(.2,.8),firstBuy:rand(30,90),moment:orig.moment});
  toast("Rival coin launched",`${esc(b.name)} launched <b>$${esc(c.ticker)}</b> for the same moment as $${esc(orig.ticker)}.`,"warn");
}

/* ---------- seeding ---------- */
let SEED_LIST=null;
function seedOne(s,now=Date.now()){
  const created=now-s.ageMin*60000;
  const c=launchCoin({...s,artKey:s.artKey||s.ticker,moment:s.moment||"m_"+(s.artKey||s.ticker),created,firstBuy:rand(30,80)},true);c.fate=s.fate??.6;
  const steps=Math.round(rand(80,130)),span=now-created-4000;
  for(let i=1;i<=steps;i++){
    const f=i/steps,t=created+f*span;
    const shape=Math.pow(f,.75)+Math.sin(f*9+s.ageMin)*.06;
    const goal=GRAD*(s.target??.4)*clamp(shape,0,1.2)+rand(-250,250);
    const diff=goal-c.real;
    if(diff>0||Math.random()<.18){const b=pick(S.bots);doBuy(c,b.name,clamp(Math.abs(diff)*rand(.4,1.2),5,1400),t,true)}
    else{const hs=Object.keys(c.holders).filter(n=>n!==c.creator);if(hs.length){const n=pick(hs);doSell(c,n,c.holders[n].tok*rand(.3,1),t,true)}}
  }
  for(let i=0;i<Math.round(rand(3,7));i++){const b=pick(S.bots);c.chat.unshift({who:b.name,type:b.type,text:talkLine(c,b),t:created+rand(.2,1)*span})}
  c.chat.sort((a,b)=>b.t-a.t);
  c.lastAct=now-rand(1000,s.ageMin*20000);
  return c;
}
function seed(){
  S=freshState();const now=Date.now();
  (SEED_LIST||SEEDS).forEach(x=>seedOne(x,now));
  S.coins.sort((a,b)=>b.lastAct-a.lastAct);
}
/* coins.json sits next to the page and is refreshed by the daily routine: new recent moments are added,
   coins older than ~2 weeks retire (unless you hold them or launched them). */
async function loadCoins(){
  try{const r=await fetch("coins.json",{cache:"no-store"});if(!r.ok)return;const d=await r.json();if(!d||!Array.isArray(d.coins)||!d.coins.length)return;
    SEED_LIST=d.coins;const now=Date.now();const have=new Set(S.coins.map(c=>c.artKey||c.ticker));let added=0;
    d.coins.forEach(x=>{const k=x.artKey||x.ticker;if(!have.has(k)){const c=seedOne({...x,ageMin:Math.min(x.ageMin||30,30)},now);c.lastAct=now;added++}});
    const keep=new Set(d.coins.map(x=>x.artKey||x.ticker)),cutoff=now-15*86400e3;let removed=0;
    S.coins=S.coins.filter(c=>{const old=c.date&&Date.parse(c.date)<cutoff;const drop=old&&!keep.has(c.artKey||c.ticker)&&!c.isUser&&!c.holders.you&&c.id!==UI.coinId;if(drop)removed++;return!drop});
    if(added||removed){cardEls.clear();if(UI.view!=="coin")build();if(added)toast("New moments",`${added} new coin${added>1?"s":""} from the last few days just hit the board.`)}
  }catch(e){}
}

const SPORT_PLAY={Basketball:"dunk",Soccer:"strike",Football:"catch",Baseball:"swing",Hockey:"slapshot",Tennis:"serve",Combat:"punch",Swimming:"swim",Track:"sprint",Other:"celebrate"};
function drawProps(x,props,S,ox,oy,col,front){
  const P=(q)=>[ox+q[0]*S,oy+q[1]*S];
  for(const pr of props){if(!!pr.front!==front)continue;
    x.save();x.strokeStyle=col;x.fillStyle=col;x.lineCap="round";x.lineJoin="round";x.globalAlpha=pr.alpha??1;
    if(pr.t==="ball"){x.fillStyle="#ffffff";x.beginPath();x.arc(...P([pr.x,pr.y]),pr.r*S,0,7);x.fill()}
    else if(pr.t==="line"){x.lineWidth=pr.w*S;x.beginPath();x.moveTo(...P(pr.a));x.lineTo(...P(pr.b));x.stroke()}
    else if(pr.t==="dash"){x.lineWidth=1.8*S;x.setLineDash([3*S,3*S]);x.globalAlpha=.8;x.beginPath();pr.pts.forEach((q,i)=>i?x.lineTo(...P(q)):x.moveTo(...P(q)));x.stroke()}
    else if(pr.t==="ell"){x.beginPath();x.ellipse(...P([pr.x,pr.y]),pr.rx*S,pr.ry*S,pr.rot,0,7);if(pr.stroke){x.lineWidth=1.8*S;x.stroke()}else x.fill()}
    else if(pr.t==="net"){x.lineWidth=1.2*S;x.globalAlpha=.75;for(let i=0;i<=3;i++){x.beginPath();x.moveTo(...P([pr.x+i*pr.w/3,pr.y]));x.lineTo(...P([pr.x+pr.w*.2+i*pr.w*.2,pr.y+pr.h]));x.stroke()}x.beginPath();x.moveTo(...P([pr.x+pr.w*.1,pr.y+pr.h*.5]));x.lineTo(...P([pr.x+pr.w*.9,pr.y+pr.h*.5]));x.stroke()}
    else if(pr.t==="goal"){x.lineWidth=2.5*S;x.beginPath();x.moveTo(...P([pr.x,90]));x.lineTo(...P([pr.x,pr.y]));x.lineTo(...P([100,pr.y]));x.stroke();x.lineWidth=.8*S;x.globalAlpha=.5;for(let i=1;i<5;i++){x.beginPath();x.moveTo(...P([pr.x+i*(100-pr.x)/5,pr.y]));x.lineTo(...P([pr.x+i*(100-pr.x)/5,90]));x.stroke();x.beginPath();x.moveTo(...P([pr.x,pr.y+i*(90-pr.y)/5]));x.lineTo(...P([100,pr.y+i*(90-pr.y)/5]));x.stroke()}}
    else if(pr.t==="spark"){x.lineWidth=2.2*S;for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r1=pr.r*.35*S,r2=pr.r*(i%2?.7:1)*S,[cx,cy]=P([pr.x,pr.y]);x.beginPath();x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);x.stroke()}}
    else if(pr.t==="wave"){x.lineWidth=2.4*S;x.beginPath();for(let i=0;i<=100;i+=2){const q=P([i,pr.y+Math.sin(i/5)*2]);i?x.lineTo(...q):x.moveTo(...q)}x.stroke();x.globalAlpha=.25;x.lineTo(...P([100,100]));x.lineTo(...P([0,100]));x.closePath();x.fill()}
    else if(pr.t==="ground"){x.lineWidth=1.6*S;x.globalAlpha=.45;x.beginPath();x.moveTo(ox-60*S,oy+pr.y*S);x.lineTo(ox+160*S,oy+pr.y*S);x.stroke()}
    else if(pr.t==="fallen"){x.lineWidth=6*S;x.globalAlpha=.55;const[cx,cy]=P([pr.x,pr.y]);x.beginPath();x.moveTo(cx-12*S,cy);x.lineTo(cx+8*S,cy-2*S);x.stroke();x.beginPath();x.arc(cx+13*S,cy-4*S,4.5*S,0,7);x.fill()}
    x.restore()}
}
function drawFig(x,f,S,ox,oy,col,glow){
  const P=(q)=>[ox+q[0]*S,oy+q[1]*S];const sh=[f.n[0]+(f.p[0]-f.n[0])*.15,f.n[1]+(f.p[1]-f.n[1])*.15];
  x.save();x.strokeStyle=col;x.fillStyle=col;x.lineCap="round";x.lineJoin="round";x.shadowColor="rgba(0,0,0,.18)";x.shadowBlur=S*1.5;x.shadowOffsetY=S*.8;if(f.ghost){x.globalAlpha=.5;x.shadowBlur=0}
  const path=(pts,w)=>{x.lineWidth=w*S;x.beginPath();pts.forEach((q,i)=>i?x.lineTo(...P(q)):x.moveTo(...P(q)));x.stroke()};
  path([f.n,f.p],10.5);path([sh,f.le,f.lh],7);path([sh,f.re,f.rh],7);path([f.p,f.lk,f.lf],8);path([f.p,f.rk,f.rf],8);
  x.beginPath();x.arc(...P(f.h),6.8*S,0,7);x.fill();x.restore();
}
function drawBackdrop(x,c,w,h,p){
  x.fillStyle=p.bg;x.fillRect(0,0,w,h);const s=Math.max(w,h);
  x.save();x.globalAlpha=.1;x.fillStyle=p.fg;x.strokeStyle=p.fg;
  if(c.pat==="rays"){const n=22;for(let i=0;i<n;i+=2){const a0=Math.PI+(i/n)*Math.PI,a1=Math.PI+((i+1)/n)*Math.PI;x.beginPath();x.moveTo(w/2,h*1.05);x.arc(w/2,h*1.05,s*1.4,a0,a1);x.closePath();x.fill()}}
  else if(c.pat==="halftone"){x.globalAlpha=.2;const g=s/22;for(let yy=0;yy<=h/g;yy++)for(let xx=0;xx<=w/g;xx++){const r=(xx*g/w+yy*g/h)/2*g*.45+.5;x.beginPath();x.arc(xx*g,yy*g,r,0,7);x.fill()}}
  else if(c.pat==="stripes"){x.lineWidth=s/18;for(let i=-s;i<s*2;i+=s/7){x.beginPath();x.moveTo(i,0);x.lineTo(i-h,h);x.stroke()}}
  else if(c.pat==="court"){x.globalAlpha=.16;x.lineWidth=s/160;x.strokeRect(w*.05,h*.06,w*.9,h*.88);x.beginPath();x.moveTo(w/2,h*.06);x.lineTo(w/2,h*.94);x.stroke();x.beginPath();x.arc(w/2,h/2,Math.min(w,h)*.16,0,7);x.stroke()}
  else{x.lineWidth=s/60;for(let r=s*.06;r<s*1.3;r+=s/12){x.beginPath();x.arc(w*.5,h*.45,r,0,7);x.stroke()}}
  x.restore();
  const rg=x.createRadialGradient(w*.5,h*.48,0,w*.5,h*.48,Math.min(w,h)*.62);rg.addColorStop(0,"rgba(255,255,255,.16)");rg.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=rg;x.fillRect(0,0,w,h);
  const vg=x.createLinearGradient(0,0,0,h);vg.addColorStop(0,"rgba(0,0,0,.25)");vg.addColorStop(.5,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");x.fillStyle=vg;x.fillRect(0,0,w,h);
}
function drawArt(cv,c,w=320,h=320,opts={}){
  cv.width=w;cv.height=h;const x=cv.getContext("2d");const p=PALS[c.pal]||PALS.flood;
  drawBackdrop(x,c,w,h,p);
  const play=PLAYS[c.play]||PLAYS[SPORT_PLAY[c.sport]]||PLAYS.celebrate;
  const box=Math.min(w,h)*(opts.fig||.78),S=box/100,ox=(w-box)/2,oy=(h-box)/2+box*.03;
  drawProps(x,play.props,S,ox,oy,p.fg,false);
  play.figs.forEach(f=>drawFig(x,f,S,ox,oy,p.hi,p.fg));
  drawProps(x,play.props,S,ox,oy,p.fg,true);
  if(opts.labels){x.font=`700 ${Math.round(h*.045)}px "Inter", system-ui, sans-serif`;x.fillStyle=p.fg;x.globalAlpha=.9;x.textBaseline="alphabetic";x.textAlign="right";x.fillText("CLUTCH",w-h*.05,h*.09)}
}
const artCache=new Map();
function drawTickerArt(cv,c,size=320){
  cv.width=size;cv.height=size;const x=cv.getContext("2d");const p=PALS[c.pal]||PALS.flood;const s=size;
  x.fillStyle=p.bg;x.fillRect(0,0,s,s);
  x.save();x.globalAlpha=.22;x.fillStyle=p.fg;x.strokeStyle=p.fg;
  if(c.pat==="rays"){const n=18;for(let i=0;i<n;i+=2){const a0=Math.PI+(i/n)*Math.PI,a1=Math.PI+((i+1)/n)*Math.PI;x.beginPath();x.moveTo(s/2,s*1.05);x.arc(s/2,s*1.05,s*1.4,a0,a1);x.closePath();x.fill()}}
  else if(c.pat==="halftone"){x.globalAlpha=.34;const g=s/16;for(let yy=0;yy<=16;yy++)for(let xx=0;xx<=16;xx++){const r=(xx+yy)/32*g*.55+.6;x.beginPath();x.arc(xx*g,yy*g,r,0,7);x.fill()}}
  else if(c.pat==="stripes"){x.lineWidth=s/14;for(let i=-s;i<s*2;i+=s/6){x.beginPath();x.moveTo(i,0);x.lineTo(i-s,s);x.stroke()}}
  else if(c.pat==="court"){x.globalAlpha=.38;x.lineWidth=s/80;x.strokeRect(s*.06,s*.06,s*.88,s*.88);x.beginPath();x.moveTo(s/2,s*.06);x.lineTo(s/2,s*.94);x.stroke();x.beginPath();x.arc(s/2,s/2,s*.15,0,7);x.stroke();x.strokeRect(s*.06,s*.3,s*.18,s*.4);x.strokeRect(s*.76,s*.3,s*.18,s*.4);x.beginPath();x.arc(s*.24,s/2,s*.1,-Math.PI/2,Math.PI/2);x.stroke();x.beginPath();x.arc(s*.76,s/2,s*.1,Math.PI/2,Math.PI*1.5);x.stroke()}
  else{x.lineWidth=s/36;for(let r=s*.08;r<s*1.3;r+=s/10){x.beginPath();x.arc(s*.78,s*.22,r,0,7);x.stroke()}}

function applyCatalyst(ev,manual){
  const now=Date.now();const hit=[];
  ev.fx.forEach(([tag,pow])=>{
    const l=coinsForTag(tag);if(!l.length)return;
    if(pow>0){
      const total=pow*rand(700,1700)*(S.speed===2?1.4:1);
      const w=l.map((c,i)=>i===0?.55:.45/(l.length-1||1));
      l.forEach((c,i)=>{const amt=total*w[i];const n=Math.round(rand(4,8));for(let k=0;k<n;k++)S.pending.push({kind:"flow",at:now+rand(200,9000)*(i+1)*.6,id:c.id,side:"buy",amt:amt/n});c.fate=clamp(c.fate+.12*pow,.05,1);hit.push({id:c.id,ticker:c.ticker,mc:mcOf(c),dir:1})});
    }else{
      l.forEach(c=>{const n=Math.round(rand(3,7));for(let k=0;k<n;k++)S.pending.push({kind:"flow",at:now+rand(200,8000),id:c.id,side:"sell",amt:Math.min(.6,-pow*rand(.15,.35))});c.fate=clamp(c.fate+.1*pow,.05,1);hit.push({id:c.id,ticker:c.ticker,mc:mcOf(c),dir:-1})});
    }
  });
  const seen=new Set();for(let i=hit.length-1;i>=0;i--){}
  const uniq=[];hit.forEach(h=>{if(!seen.has(h.id)){seen.add(h.id);uniq.push(h)}});hit.length=0;hit.push(...uniq);
  if(!hit.length)return false;
  (S.wire||(S.wire=[])).unshift({t:now,type:ev.type,text:ev.text,tags:ev.fx.map(f=>f[0]),hits:hit});if(S.wire.length>25)S.wire.length=25;
  toast(`${ev.type} · simulated`,`${esc(ev.text)}<br><span class="note">Moving ${hit.slice(0,3).map(h=>"$"+esc(h.ticker)).join(", ")}${hit.length>3?` +${hit.length-3}`:""}</span>`,hit[0].dir>0?"":"warn");
  const mine=hit.map(h=>S.coins.find(c=>c.id===h.id)).find(c=>c&&(c.isUser||c.holders.you));
  if(mine)island(`<img alt="" src="${artURL(mine)}">$${esc(mine.ticker)}`,`<span class="${hit[0].dir>0?"up":"down"}">${ev.type}</span>`,3200);
  return true;
}
function randomCatalyst(manual){
  const live=CATALYSTS.filter(ev=>ev.fx.some(([t])=>coinsForTag(t).length));
  const recent=new Set((S.wire||[]).slice(0,6).map(w=>w.text));
  const pool=live.filter(ev=>!recent.has(ev.text));const ev=pick(pool.length?pool:live);
  if(ev)applyCatalyst(ev,manual);
}

let TAPE=[],tapeSeq=0;
function tapePush(o){o.k=++tapeSeq;o.t=Date.now();TAPE.push(o);if(TAPE.length>40)TAPE.splice(0,TAPE.length-40)}
function screenFlash(kind,quake){

const RUG_TALK=["dumped lol","whales sold. called it","WHO SOLD","chart is a cliff","I was holding the bag the whole time","never trust a fresh wallet","gg, see you next moment","that's a red candle the size of a stadium"];
function rugTarget(now){
  const l=S.coins.filter(c=>!c.grad&&!c.isUser&&!c.rugged&&c.creator!=="you"&&(now-c.created)>30000&&mcOf(c)>START_MC*2.2&&!S.pending.some(p=>p.id===c.id&&p.kind==="dump"));
  if(!l.length)return null;
  const cur=UI.view==="coin"&&l.find(c=>c.id===UI.coinId);if(cur&&Math.random()<.3)return cur;
  if(!MIS.tasks.survive){const mine=l.filter(c=>c.holders.you);if(mine.length&&Math.random()<.45)return pick(mine)}
  l.sort((a,b)=>mcOf(b)*rand(.5,1.5)-mcOf(a)*rand(.5,1.5));return l[Math.floor(Math.random()*Math.min(5,l.length))];
}
function rugPull(c,now=Date.now()){
  if(!c||c.grad||c.rugged)return false;
  const ins=Object.entries(c.holders).filter(([n])=>n!=="you"&&!devLocked(c,n)).sort((a,b)=>b[1].tok-a[1].tok).slice(0,6).map(([n])=>n);
  if(!ins.length)return false;
  const forfeit=ins.reduce((a,n)=>a+potShare(c,n,now).amt,0);
  const mc0=mcOf(c);c.rugged={t:now,by:ins[0],mc0,sellers:ins.slice(0,5),forfeit};c.fate=.06;
  let at=now+rand(60,180);
  ins.forEach((n,i)=>{const chunks=i<2?3:1;for(let k=0;k<chunks;k++){S.pending.push({kind:"dump",at,id:c.id,who:n,frac:k===chunks-1?1:.5});at+=rand(70,260)}});
  S.pending.push({kind:"rugdone",at:at+300,id:c.id});
  for(let i=0;i<5;i++)S.pending.push({kind:"panic",at:at+rand(300,6000),id:c.id});
  tapePush({id:c.id,ticker:c.ticker,side:"rug",cash:mc0,who:ins[0]});
  c.chat.unshift({who:"clutch",type:"system",text:`Dump: top holders are selling $${c.ticker} and giving up ${money(forfeit)} of Hall pot.`,t:now});
  const mine=!!c.holders.you;if(mine)MIS.watch[c.id]=now;
  toast("Whale dump",`Top holders are dumping <b>$${esc(c.ticker)}</b>. They give up ${money(forfeit)} of the Hall pot to whoever stays.`,"warn");
  if(mine)island(`<img alt="" src="${artURL(c)}">$${esc(c.ticker)}`,`<span class="down">DUMP</span>`,4200);
  if(mine||UI.coinId===c.id){screenFlash("rug",true);crack();sfx("rug");buzz([40,30,80])}
  return true;
}
function pumpRaid(c,now=Date.now()){
  if(!c)return false;
  const n=Math.round(rand(9,18));let at=now+rand(50,150);
  for(let i=0;i<n;i++){S.pending.push({kind:"flow",at,id:c.id,side:"buy",amt:rand(40,i%5===0?600:220)});at+=rand(60,320)}
  c.fate=clamp(c.fate+.15,.05,1);
  tapePush({id:c.id,ticker:c.ticker,side:"raid",cash:0,who:"raid"});
  toast("Pump raid",`A group chat just piled into <b>$${esc(c.ticker)}</b>. ${n} buys incoming.`);
  if(UI.coinId===c.id||c.holders.you)screenFlash("pump");
  if(Math.random()<.35&&!c.isUser&&c.creator!=="you"&&!c.grad)S.pending.push({kind:"rug",at:at+rand(4000,11000),id:c.id});
  return true;
}
function runFlow(p){
  const c=S.coins.find(x=>x.id===p.id);if(!c)return;
  if(p.kind==="dump"){const h=c.holders[p.who];if(!h)return;const tr=doSell(c,p.who,h.tok*(p.frac||1));const b=botOf(p.who);if(tr&&b)b.cash+=tr.cash;return}
  if(p.kind==="panic"){const hs=Object.keys(c.holders).filter(n=>n!=="you");if(!hs.length)return;const n=pick(hs);const tr=doSell(c,n,c.holders[n].tok*rand(.5,1));const b=botOf(n);if(tr&&b)b.cash+=tr.cash;if(Math.random()<.5)c.chat.unshift({who:n,type:b?.type||"paper",text:pick(RUG_TALK),t:Date.now()});return}
  if(p.side==="buy"){const b=pick(S.bots.filter(x=>x.type!=="fader"));const a=Math.min(p.amt,b.cash+400);b.cash=Math.max(0,b.cash-a);doBuy(c,b.name,a)}
  else{const hs=Object.keys(c.holders).filter(n=>n!=="you"&&n!==c.creator);if(!hs.length)return;const n=pick(hs);const b=botOf(n);const tr=doSell(c,n,c.holders[n].tok*p.amt);if(tr&&b)b.cash+=tr.cash}
}

const WIN={"1h":3600e3,"24h":86400e3};
function changeOver(c,ms){const cut=Date.now()-ms;let base=c.hist[0].mc;for(const p of c.hist){if(p.t<=cut)base=p.mc;else break}return(mcOf(c)-base)/base}
function spark(c,ms){
  const cut=Date.now()-ms;let pts=c.hist.filter(p=>p.t>=cut);if(pts.length<2)pts=c.hist.slice(-20);
  const step=Math.max(1,Math.floor(pts.length/40));pts=pts.filter((_,i)=>i%step===0).concat([c.hist[c.hist.length-1]]);
  const lo=Math.min(...pts.map(p=>p.mc)),hi=Math.max(...pts.map(p=>p.mc)),r=hi-lo||1;
  const d=pts.map((p,i)=>`${(i/(pts.length-1)*72).toFixed(1)},${(26-(p.mc-lo)/r*24).toFixed(1)}`).join(" ");
  const up=pts[pts.length-1].mc>=pts[0].mc;
  return`<svg class="spark" viewBox="0 0 72 28" width="72" height="28" aria-hidden="true"><polyline points="${d}" fill="none" stroke="${up?TH.up:TH.down}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function wireSlide(){

  kn.onpointerdown=e=>{if(sl.classList.contains("dis")){sl.classList.remove("nope");void sl.offsetWidth;sl.classList.add("nope");buzz([8,30,8]);return}
    x0=e.clientX-cur;mx=sl.clientWidth-kn.offsetWidth-8;half=false;try{kn.setPointerCapture(e.pointerId)}catch(_){}buzz(8);sl.classList.add("drag")};
  kn.onpointermove=e=>{if(x0==null)return;const v=clamp(e.clientX-x0,0,mx);set(v);if(!half&&v>mx*.5){half=true;buzz(5)}};
  const end=()=>{if(x0==null)return;x0=null;sl.classList.remove("drag");if(cur>=mx*.9){set(mx);confirmTray()}else back()};
  kn.onpointerup=end;kn.onpointercancel=end;

const SND={on:true,ctx:null};

function tone(c,{f=440,f2,type="sine",t=0,d=.15,v=.06}){const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.03)}

function sfx(k){if(!SND.on||!SND.ctx)return;const c=actx();if(!c)return;try{
  if(k==="buy"){tone(c,{f:660,f2:990,d:.12,v:.05,type:"triangle"});tone(c,{f:990,t:.08,d:.14,v:.04,type:"triangle"})}
  else if(k==="sell"){tone(c,{f:560,f2:380,d:.16,v:.05,type:"triangle"})}

  else if(k==="rug"){noise(c,{d:.22,v:.16,hp:300});tone(c,{f:440,f2:55,d:1,v:.07,type:"sawtooth"});tone(c,{f:330,f2:40,t:.06,d:1,v:.05,type:"square"})}

const SPEEDS=[{acts:1,ms:480},{acts:1,ms:150},{acts:2,ms:75}];
let timer=null,lastIncome=Date.now(),lastSave=Date.now();
function tick(){
  const now=Date.now(),sp=SPEEDS[S.speed];
  for(let i=0;i<sp.acts;i++)botAct(now);
  /* the coin you're looking at gets its own crowd, so its chart never sits still */
  if(UI.view==="coin"){const fc=curCoin();if(fc){const n=Math.random()<[.45,.85,.95][S.speed]?(S.speed===2?2:1):0;for(let i=0;i<n;i++)botAct(now,fc,fc.rugged&&now-fc.rugged.t<20000?.35:.8)}}
  if(now-lastIncome>2500){lastIncome=now;const m=[.5,.8,1.3][S.speed];S.bots.forEach(b=>{b.cash+=(b.type==="whale"?110:16)*m})}
  if(!S.nextCat)S.nextCat=now+rand(15000,25000);if(now>S.nextCat){randomCatalyst();S.nextCat=now+rand(35000,65000)/(S.speed===2?2:S.speed===0?.6:1)}
  trendTick(now);if(UI.view==="trend")updTrendEta();
  if(now>S.nextBotLaunch){botLaunch(now);S.nextBotLaunch=now+rand(22000,40000)/(S.speed+1)*2}
  if(!S.nextRug)S.nextRug=now+rand(9000,16000);
  if(now>S.nextRug){rugPull(rugTarget(now),now);S.nextRug=now+rand(18000,34000)*[2.2,1,.5][S.speed]}
  if(!S.nextRaid)S.nextRaid=now+rand(5000,9000);
  if(now>S.nextRaid){const l=S.coins.filter(c=>!c.rugged);pumpRaid(l.length?pickCoinFrom(l,now):null,now);S.nextRaid=now+rand(12000,24000)*[2.2,1,.5][S.speed]}
  S.pending=S.pending.filter(p=>{if(now<p.at)return true;if(p.kind==="flow"||p.kind==="dump"||p.kind==="panic"){runFlow(p);return false}
    if(p.kind==="rug"){rugPull(S.coins.find(x=>x.id===p.id),now);return false}
    if(p.kind==="rugdone"){const c=S.coins.find(x=>x.id===p.id);if(c&&c.rugged){const d=(mcOf(c)-c.rugged.mc0)/c.rugged.mc0;c.rugged.drop=d;(S.wire||(S.wire=[])).unshift({t:now,type:"Dump",text:`Top holders dumped $${c.ticker} · ${pct(d)} in seconds`,tags:[],hits:[{id:c.id,ticker:c.ticker,mc:c.rugged.mc0,dir:-1}]});if(S.wire.length>25)S.wire.length=25}return false}
    if(p.kind==="rival"){const c=S.coins.find(x=>x.id===p.id);if(c)rivalLaunch(c)}return false});
  if(now-lastUpd>=(UI.view==="coin"||UI.view==="board"?200:600)){lastUpd=now;update()}
  islandWatch();
  if(now-lastSave>8000){lastSave=now;save()}
  for(const id in MIS.watch){if(now-MIS.watch[id]>45000){const c=S.coins.find(x=>x.id===id);if(c&&c.holders.you)completeTask("survive");delete MIS.watch[id]}}
  if(now-CLOUD.lastPush>15000)pushScore(now);
}
let lastUpd=0;
function pickCoinFrom(l,now){const ws=l.map(c=>heat(c,now));const tot=ws.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<l.length;i++){r-=ws[i];if(r<=0)return l[i]}return l[l.length-1]}
function start(){clearInterval(timer);timer=setInterval(tick,SPEEDS[S.speed].ms)}

/* ---------- persistence ---------- */
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const s=JSON.parse(raw);if(!s||!Array.isArray(s.coins)||!s.coins.length)return false;S=s;S.pending=S.pending||[];S.trend=S.trend||{};return true}catch(e){return false}}

/* ---------- device scaling ---------- */
function scaleDevice(){
  const stage=$("#stage"),dev=$("#device");
  if(window.innerWidth<520){document.body.classList.add("bleed");stage.style.width=stage.style.height="";return}
  document.body.classList.remove("bleed");
  const s=Math.min(1,(window.innerHeight-60)/902,(window.innerWidth-32)/430);
  dev.style.transform=`scale(${s})`;stage.style.width=430*s+"px";stage.style.height=902*s+"px";
}
window.addEventListener("resize",()=>{scaleDevice();if(UI.view==="coin")updCoin()});
window.addEventListener("load",scaleDevice);window.addEventListener("orientationchange",scaleDevice);setTimeout(scaleDevice,300);setTimeout(scaleDevice,1200);

/* ---------- wiring ---------- */
$("#nav").onclick=e=>{const b=e.target.closest("[data-v]");if(b)setView(b.dataset.v)};
$("#launchBtn").onclick=()=>openLaunch();
document.addEventListener("keydown",e=>{if(UI.view!=="trend"||$("#modal"))return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();scroller.scrollBy({top:(e.key==="ArrowDown"?1:-1)*scroller.clientHeight,behavior:"smooth"})}});
$("#abBuy").onclick=()=>openTrade("buy");
$("#abSell").onclick=()=>openTrade("sell");

async function boot(){
  let th="light";try{th=localStorage.getItem("clutch-theme")||"light"}catch(_){}setTheme(th);
  scaleDevice();
  main.innerHTML=skeletonHTML();
  try{await Promise.race([Promise.all([document.fonts.load('900 80px "Big Shoulders Display"'),document.fonts.load('700 14px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  if(!load())seed();
  if(typeof S.speed!=="number")S.speed=1;
  armSnipes();build();start();loadTrending();loadCoins();initCloud();setTimeout(()=>showIntro(false),600);
  try{const h=(location.hash||"").replace("#","").toUpperCase();const c=h&&S.coins.find(x=>x.ticker===h);if(c)openCoin(c.id)}catch(e){}
  window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","").toUpperCase();const c=S.coins.find(x=>x.ticker===h);if(c)openCoin(c.id)});
}
boot();
})();
</script>
