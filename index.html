<!doctype html><html><head><meta charset=utf8><title>Clutch</title><meta name="description" content="Launch coins on live sports moments. Play money prototype."><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Clutch"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta http-equiv="Cache-Control" content="no-cache"><script>(function(){var B="2026-10-20b";try{fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(v){if(v&&v.build&&v.build!==B){var q=new URLSearchParams(location.search);if(q.get("b")!==v.build){q.set("b",v.build);location.replace(location.pathname+"?"+q.toString())}}}).catch(function(){})}catch(e){}})();</script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clutch Moment Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: the app runs inside an iPhone 18 Pro frame (402x874pt screen, smaller Dynamic Island). Liquid Glass tab bar, sheets and banners float over a single scrolling column. On a real phone the frame drops away and the app goes full screen. */
:root{
  --bg:#07080c; --stage:#050608; --panel:#10131b; --panel2:#171b26; --line:#232939; --fg:#f2f4f9; --mute:#8d95aa; --dim:#5d6479;
  --go:#39ff88; --go-ink:#03140a; --dump:#ff4d8d; --fame:#ffd23f; --info:#6cb4ff;
  --glass:rgba(30,34,47,.74); --glass-hi:rgba(255,255,255,.16); --glass-brd:rgba(255,255,255,.11);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Figtree",system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 600px at 50% 40%,rgba(57,255,136,.07),transparent 60%),var(--stage);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
a{color:var(--info);text-decoration:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- stage & device ---------- */
.stagewrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px}
.stage{position:relative;flex-shrink:0}
.device{position:absolute;left:0;top:0;width:430px;height:902px;transform-origin:top left;border-radius:72px;padding:5px;
  background:linear-gradient(150deg,#5a5f69 0%,#2a2d33 18%,#1a1c20 50%,#34373e 82%,#5b6069 100%);
  box-shadow:0 0 0 1px #0c0d10,0 40px 90px rgba(0,0,0,.65),0 0 120px rgba(57,255,136,.06)}
.device::before{content:"";position:absolute;inset:1.5px;border-radius:70px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.bezel{width:100%;height:100%;background:#000;border-radius:67px;padding:9px;overflow:clip}
.btn-side{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1c1e22,#4a4e56)}
.btn-side.l1{left:-3px;top:170px;height:34px}.btn-side.l2{left:-3px;top:230px;height:62px}.btn-side.l3{left:-3px;top:306px;height:62px}
.btn-side.r1{right:-3px;top:250px;height:96px;background:linear-gradient(270deg,#1c1e22,#4a4e56)}
.btn-side.r2{right:-3px;top:560px;height:70px;border-radius:3px;background:linear-gradient(270deg,#121316,#3a3d44)}
.caption{font-size:12px;color:var(--dim);text-align:center}
.caption b{color:var(--mute);font-weight:600}

.screen{position:relative;width:402px;height:874px;border-radius:58px;overflow:hidden;overflow:clip;background:var(--bg);isolation:isolate}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.statusbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 50px;pointer-events:none;font-weight:600;font-size:17px;letter-spacing:-.2px}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:45;width:98px;height:30px;border-radius:20px;background:#000;transition:width .45s cubic-bezier(.3,1.4,.5,1),height .45s cubic-bezier(.3,1.4,.5,1),border-radius .45s;display:flex;align-items:center;justify-content:space-between;padding:0 10px;overflow:hidden;color:#fff}
.island .ia{opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;font-weight:600;min-width:0}
.island img{width:22px;height:22px;border-radius:6px}
.island.open{width:268px;height:40px;border-radius:24px}
.island.open .ia{opacity:1;transition-delay:.18s}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(0deg,rgba(7,8,12,.95),rgba(7,8,12,0));pointer-events:none;z-index:34}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);z-index:46;pointer-events:none}

/* full-bleed on real phones */
body.bleed{overflow:hidden}
body.bleed .stagewrap{padding:0;display:block}
body.bleed .stage{position:fixed;inset:0;width:auto!important;height:auto!important}
body.bleed .device{position:absolute;inset:0;width:auto;height:auto;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
body.bleed .device::before,body.bleed .btn-side,body.bleed .caption,body.bleed .statusbar,body.bleed .homebar{display:none}
body.bleed .bezel{padding:0;border-radius:0}
body.bleed .screen{width:100%;height:100%;border-radius:0}
body.bleed .island{display:none}
body.bleed .navbar{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
body.bleed .tabdock,body.bleed .actionbar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}

/* ---------- glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.25),0 12px 34px rgba(0,0,0,.45)}

/* nav bar */
.navbar{position:sticky;top:0;z-index:30;padding:56px 16px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(7,8,12,.92) 0%,rgba(7,8,12,.72) 70%,rgba(7,8,12,0));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.navbar .l{justify-self:start;display:flex;align-items:center;min-width:0}
.navbar .c{font-weight:700;font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap}
.navbar.scrolled .c{opacity:1}
.navbar .r{justify-self:end}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.4px;line-height:1}
.brand b{color:var(--go)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13.5px}
.pill .dotg{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}
.backbtn{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:7px 12px 7px 8px;font-weight:600;font-size:15px;border:1px solid var(--glass-brd)}
.large{font-family:var(--body);font-weight:800;font-size:34px;letter-spacing:-.6px;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.lede{color:var(--mute);margin:0 0 14px;font-size:14px}
.page{padding:0 16px 130px}

h2,h3{margin:0;line-height:1.1}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute)}
.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--panel2);color:var(--fg)}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.dump{background:var(--dump);color:#1a0610}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.full{width:100%}

/* segmented (iOS) */
.segm{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:rgba(118,118,128,.18);margin-bottom:12px}
.segm button{border:0;background:none;border-radius:9px;padding:6px 0;font-size:13px;font-weight:600;color:var(--mute)}
.segm button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.seglabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}

/* flashes */
.flashes{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.flash{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;border:0;text-align:left;min-width:0;width:100%}
.flash .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash.buy{background:var(--go);color:var(--go-ink)}
.flash.sell{background:var(--dump);color:#1a0610}
.flash.launch{background:var(--fame);color:#1b1400}
.flash.pop{animation:shake .35s}
@keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(4px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}100%{transform:translateX(0)}}

/* king of the hill */
.koth{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;padding:12px;border-radius:22px;margin-bottom:16px;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,210,63,.16),rgba(255,210,63,.03) 60%),var(--panel);border:1px solid rgba(255,210,63,.3)}
.koth img{width:92px;height:92px;border-radius:14px;display:block}
.koth .crown{color:var(--fame);font-size:9.5px}
.koth h2{font-family:var(--display);font-weight:800;font-size:24px;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.koth .stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
.koth .stats b{font-family:var(--mono);color:var(--fg)}

/* filters */
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{border-color:var(--go);color:var(--go);background:rgba(57,255,136,.08)}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.search{background:rgba(118,118,128,.18);border:0;border-radius:12px;padding:9px 12px;min-width:0;width:100%;font-size:14px}
.search::placeholder{color:var(--dim)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px;border-radius:18px;background:var(--panel);border:1px solid transparent;cursor:pointer;min-width:0}
.card img{width:78px;height:78px;border-radius:12px;display:block}
.card .ci{min-width:0;display:flex;flex-direction:column;gap:1px}
.card .row{display:flex;align-items:center;gap:6px;min-width:0}
.tk{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mcrow{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;margin-top:3px}
.card .mcrow b{font-family:var(--mono);color:var(--go)}
.card .bar{margin-top:4px}
.card.bump{animation:shake .35s;border-color:rgba(57,255,136,.55)}
.card.bump.s{border-color:rgba(255,77,141,.55)}
.card.mine{box-shadow:inset 0 0 0 1px rgba(108,180,255,.5)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.tag.career{background:rgba(108,180,255,.16);color:var(--info)}
.tag.relic{background:rgba(255,77,141,.15);color:var(--dump)}
.tag.hof{background:rgba(255,210,63,.16);color:var(--fame)}
.tag.you{background:rgba(57,255,136,.14);color:var(--go)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:3px}
.bar.full i{background:var(--fame)}
.up{color:var(--go)} .down{color:var(--dump)}
.empty{padding:34px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:18px}

/* coin page */
.chead{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;margin:4px 0 10px}
.chead img{width:76px;height:76px;border-radius:16px}
.chead h1{font-family:var(--display);font-weight:900;font-size:32px;margin:0;line-height:1;letter-spacing:.3px}
.chead .nm{color:var(--mute);font-weight:600;font-size:14px;margin-top:2px}
.sub{color:var(--mute);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.moment{font-size:15px;margin:0 0 14px}
.panel{background:var(--panel);border-radius:22px;padding:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-bottom:10px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.kv b{font-family:var(--mono);font-size:15px}
.chartbox{height:230px}
.curvebox{height:150px}
.chartbox canvas,.curvebox canvas{width:100%;height:100%;display:block}
.note{font-size:12px;color:var(--mute)}
.hofbar .bar{height:9px;border-radius:5px}
.hofbar p{margin:8px 0 0;font-size:12.5px;color:var(--mute)}
.possum{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.possum b{font-family:var(--mono)}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:rgba(118,118,128,.18);margin-bottom:12px}
.subtabs button{border:0;background:none;border-radius:9px;padding:6px 0;font-size:13px;font-weight:600;color:var(--mute)}
.subtabs button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:600;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:5px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid rgba(35,41,57,.6);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto;margin-inline:-4px}
.who{display:inline-flex;align-items:center;gap:6px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.persona{font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--mute);text-transform:uppercase}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:var(--panel2);border-radius:16px 16px 16px 6px;max-width:92%}
.msg.me{align-self:flex-end;background:rgba(57,255,136,.14);border-radius:16px 16px 6px 16px}
.msg .h{font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
.chatform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.rivals{display:flex;flex-direction:column;gap:6px}
.rival{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:14px;background:var(--panel2);border:0;text-align:left;width:100%}
.rival img{width:36px;height:36px;border-radius:9px}
.rival.cur{box-shadow:inset 0 0 0 1px var(--go)}

/* hall / tiles */
.plaques{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plaque{background:linear-gradient(180deg,rgba(255,210,63,.12),var(--panel) 70%);border:1px solid rgba(255,210,63,.28);border-radius:20px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.plaque img{width:100%;aspect-ratio:1;border-radius:14px;display:block;max-width:100%}
.plaque h3{font-family:var(--display);font-weight:800;font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plaque .meta{font-size:11px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border-radius:18px;padding:12px 14px}
.tile span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.tile b{display:block;font-family:var(--mono);font-size:18px;margin-top:2px}

/* tab dock (Liquid Glass) */
.tabdock{position:absolute;left:14px;right:14px;bottom:26px;z-index:35;display:flex;gap:10px;align-items:center;transition:transform .35s cubic-bezier(.3,1.2,.5,1),opacity .25s}
.tabdock.hide{transform:translateY(120px);opacity:0;pointer-events:none}
.tabbar{flex:1;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:999px;height:64px}
.tabbar button{border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--go);background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.fab{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--go);border:1px solid var(--glass-brd)}
.fab svg{width:26px;height:26px}
.actionbar{position:absolute;left:14px;right:14px;bottom:26px;z-index:35;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:999px;transition:transform .35s cubic-bezier(.3,1.2,.5,1),opacity .25s}
.actionbar.hide{transform:translateY(120px);opacity:0;pointer-events:none}
.actionbar .btn{padding:14px}

/* sheets */
.modal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:calc(100% - 16px);margin:0 8px 8px;max-height:calc(100% - 64px);overflow-y:auto;border-radius:40px;padding:10px 18px 22px;background:rgba(22,25,35,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 40px rgba(0,0,0,.5);animation:up .38s cubic-bezier(.2,1.1,.4,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheethead h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.x{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:32px;height:32px;flex-shrink:0;font-size:14px;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--mute)}
.input{background:rgba(118,118,128,.2);border:1px solid transparent;border-radius:14px;padding:11px 13px;width:100%;font-size:15px}
.input:focus{border-color:var(--go);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--mute)}
.opt[aria-pressed="true"]{border-color:var(--go);color:var(--fg);background:rgba(57,255,136,.08)}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.previewrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:14px}
.previewrow canvas{width:120px;height:120px;border-radius:18px;display:block}
.hint{font-size:12px;color:var(--mute);line-height:1.45}
.hint b{color:var(--fg)}
.err{color:var(--dump);font-size:12.5px;min-height:16px;margin-bottom:6px}
input[type=range]{accent-color:var(--go);width:100%}
.bs{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:14px;background:rgba(118,118,128,.18);margin-bottom:14px}
.bs button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;color:var(--mute)}
.bs button[aria-pressed="true"].b{background:var(--go);color:var(--go-ink)}
.bs button[aria-pressed="true"].s{background:var(--dump);color:#1a0610}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.quick.four{grid-template-columns:repeat(4,1fr)}
.quick button{border:0;background:rgba(118,118,128,.2);border-radius:10px;padding:8px 0;font-size:12.5px;font-family:var(--mono)}
.est{font-size:12.5px;color:var(--mute);margin-bottom:12px;min-height:18px}
.sharecard{border-radius:26px;padding:14px;background:linear-gradient(160deg,#2a2006,#0d0f15 60%);border:1px solid rgba(255,210,63,.5);display:flex;flex-direction:column;gap:8px}
.sharecard img{width:100%;border-radius:18px;display:block}
.sharecard h3{font-family:var(--display);font-weight:800;font-size:26px}
.sharecard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px;color:var(--mute)}
.sharecard .grid2 b{display:block;font-family:var(--mono);font-size:14px;color:var(--fg)}

/* banners (iOS notifications) */
.toasts{position:absolute;left:10px;right:10px;top:58px;z-index:48;display:flex;flex-direction:column;gap:6px;pointer-events:none}
body.bleed .toasts{top:calc(env(safe-area-inset-top,0px) + 8px)}
.toast{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:11px 13px;border-radius:26px;font-size:13px;line-height:1.3;animation:drop .4s cubic-bezier(.2,1.2,.4,1);pointer-events:auto}
.toast .ico{width:36px;height:36px;border-radius:9px;background:#0b0d12;border:1px solid rgba(57,255,136,.5);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;color:var(--go);font-size:18px}
.toast.fame .ico{border-color:var(--fame);color:var(--fame)}
.toast.warn .ico{border-color:var(--dump);color:var(--dump)}
.toast .th{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.toast .th span{color:var(--mute);font-weight:500;font-size:12px}
.toast.out{animation:rise .3s forwards}
@keyframes drop{from{transform:translateY(-80px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
/* moment presentation */
.tkm{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.4px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkm.big{font-size:14px;color:var(--fg)}
.card{grid-template-columns:84px 1fr}
.card img{width:84px;height:84px}
.card .hl{font-weight:700;font-size:14px;line-height:1.25;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.card .sline{font-family:var(--mono);font-size:10.5px;color:var(--fame);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.koth .khl{font-family:var(--body);font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 6px}
.mcard{background:var(--panel);border-radius:26px;overflow:hidden;margin:4px 0 12px}
.mart{position:relative}
.mart img{width:100%;display:block;aspect-ratio:720/420;max-width:100%}
.sb{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.5px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.sb.over{position:absolute;left:12px;top:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sb .team{color:#d7dbe6}
.sb .sc{color:var(--fame);font-size:15px;text-shadow:0 0 8px rgba(255,210,63,.55)}
.sb .dashx{color:var(--dim)}
.sb .clk{color:var(--go);padding-left:8px;border-left:1px solid rgba(255,255,255,.15);text-shadow:0 0 8px rgba(57,255,136,.5)}
.mbody{padding:14px 16px 16px}
.headline{font-family:var(--body);font-weight:800;font-size:25px;line-height:1.12;letter-spacing:-.5px;margin:6px 0 8px;text-wrap:balance}
.mbody .moment{color:#c9cedb;font-size:14.5px;margin:0 0 12px;line-height:1.45}
.statchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.statchips span{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(255,210,63,.1);color:var(--fame);border:1px solid rgba(255,210,63,.22)}
.thesis{border-radius:14px;padding:10px 12px;background:rgba(108,180,255,.08);border:1px solid rgba(108,180,255,.22);margin-bottom:12px;font-weight:600;font-size:14px}
.thesis div{margin-top:3px}
.coinline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);margin-bottom:4px}
.plaque .phl{font-family:var(--body);font-weight:700;font-size:13px;line-height:1.25;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0;white-space:normal}
.sharecard .mart img{border-radius:18px}
.sharecard h3{font-family:var(--body);font-weight:800;font-size:22px;letter-spacing:-.4px;line-height:1.15}
.playgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.playbtn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:600;color:var(--mute)}
.playbtn img{width:100%;aspect-ratio:1;border-radius:8px;display:block}
.playbtn[aria-pressed="true"]{border-color:var(--go);color:var(--fg)}
.lprev{border-radius:20px;overflow:hidden;background:var(--panel);margin-bottom:14px}
.lprev .mart canvas{width:100%;display:block;aspect-ratio:720/420}
.lprev .pb{padding:10px 12px 12px}
.lprev .pb h3{font-weight:800;font-size:17px;letter-spacing:-.3px;line-height:1.2;margin:4px 0 0}
.sbfields{display:grid;grid-template-columns:1.3fr .8fr .8fr 1.3fr;gap:6px}
.sbfields .input{padding:10px 8px;font-size:14px;text-align:center}
.lthumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#cfd4e0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px),linear-gradient(160deg,#1d2130,#0b0d13);border:1.5px dashed rgba(255,255,255,.25)}

.lthumb svg,.lthumb span{position:relative}
.lthumb span{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--mute)}
.segm.two{grid-template-columns:1fr 1fr}
.tag.fresh{background:rgba(57,255,136,.16);color:var(--go)}
.tag.vault{background:rgba(192,139,255,.16);color:#c08bff}
.tag.lic{background:rgba(255,255,255,.1);color:#fff}
.tbadge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;font-family:var(--mono);font-weight:700;letter-spacing:0;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 70% 45%),hsl(var(--h) 70% 25%));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.sline.lteams{display:flex;align-items:center;gap:5px}
.sb.lsb{gap:7px;padding:5px 9px}
.lphoto{position:relative;aspect-ratio:720/420;overflow:hidden;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px),linear-gradient(160deg,#1d2130,#0b0d13)}
.lphoto .ghostart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:blur(2px) saturate(.4)}
.phslot{position:absolute;inset:14px;border:1.5px dashed rgba(255,255,255,.28);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:40px 24px 16px;color:#cfd4e0}
.phslot b{font-size:14px}.phslot span{font-size:11.5px;color:var(--mute);max-width:32ch}
.offbadge{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:5px;background:#fff;color:#000;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:5px 9px;border-radius:999px;text-transform:uppercase}
.athlete{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--panel2);margin-bottom:10px}
.headshot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 5px,transparent 5px 10px),#232838;color:#5d6479;border:1.5px dashed rgba(255,255,255,.25)}
.aname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--info);color:#000;font-size:10px;font-weight:900}
.sig{font-family:"Brush Script MT","Segoe Script",cursive;font-size:20px;color:var(--info);transform:rotate(-8deg)}
.clip{position:relative;border-radius:16px;overflow:hidden;height:120px;margin-bottom:12px;background:#000}
.clipart{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;filter:saturate(.7)}
.playbtn2{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;padding-left:3px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.clipmeta{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;flex-direction:column;font-size:11.5px;color:#c9cedb}
.clipmeta b{color:#fff;font-size:13px}
.royalty{border-radius:14px;padding:10px 12px;background:rgba(57,255,136,.06);border:1px solid rgba(57,255,136,.18);margin-bottom:12px}
.rrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.rrow span{display:flex;flex-direction:column;font-size:10.5px;color:var(--mute);line-height:1.2}
.rrow b{font-family:var(--mono);color:var(--go);font-size:14px;margin-top:2px}
.card img,.koth img,.rival img,.island img,.plaque img,.lthumb img{object-fit:cover}
.mart img{object-fit:cover}
.artsrc{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.trendrail{margin-bottom:16px}
.thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.thead h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--dump);box-shadow:0 0 0 0 rgba(255,77,141,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,141,.6)}70%{box-shadow:0 0 0 10px rgba(255,77,141,0)}100%{box-shadow:0 0 0 0 rgba(255,77,141,0)}}
.trail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.trail::-webkit-scrollbar{display:none}
.trend{flex:0 0 272px;scroll-snap-align:start;background:linear-gradient(160deg,rgba(255,77,141,.10),var(--panel) 55%);border:1px solid rgba(255,77,141,.25);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px}
.trend.done{background:var(--panel);border-color:var(--line);opacity:.85}
.trow{display:flex;align-items:center;gap:6px}
.buzzbar{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.buzzbar i{display:block;height:100%;background:linear-gradient(90deg,var(--fame),var(--dump))}
.bnum{font-size:11px;font-weight:700;color:var(--dump)}
.tsport{font-size:11px;color:var(--mute)}
.livepill{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.8px;color:#fff;background:var(--dump);padding:2px 6px;border-radius:4px;margin-left:auto}
.trend h3{font-size:14.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:54px}
.tmeta{font-size:11px;color:var(--dim)}
.tmeta a{color:var(--mute)}
.tfoot{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.btn.sm{padding:8px 12px;font-size:13px}
.eta{font-size:11px;color:var(--mute);font-family:var(--mono)}
.eta.hot{color:var(--dump)}
.tstat{font-size:12px;font-weight:700}
.trendteaser{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;border:1px solid rgba(255,77,141,.3);background:linear-gradient(120deg,rgba(255,77,141,.14),var(--panel) 70%);text-align:left;font-size:14px}
.trendteaser .tt-go{margin-left:auto;font-weight:700;color:var(--dump);white-space:nowrap}
.tabbar button{font-size:9.5px}
.scroller.snap{scroll-snap-type:y mandatory}
.scroller.snap>#main{height:100%}
.reels{height:100%}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.rbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.94) 100%)}

body.bleed .reelhead{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.rtabs{display:flex;flex-direction:column;line-height:1.15}
.rtabs b{font-size:18px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.rtabs .note{font-size:11px;color:#d6dae5;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.rsb{position:absolute;left:16px;top:112px;z-index:3}
body.bleed .rsb{top:calc(env(safe-area-inset-top,0px) + 62px)}
.rrail{position:absolute;right:10px;bottom:230px;z-index:4;display:flex;flex-direction:column;gap:16px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-size:10.5px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.rbtn b{font-size:13px;font-family:var(--mono)}
.rico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18)}
.buzzico{color:var(--dump)}
.rbody{position:absolute;left:0;right:64px;bottom:108px;z-index:4;padding:0 16px}

.reye{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#d6dae5;margin-bottom:6px}
.newpill,.hotpill{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.8px;padding:2px 6px;border-radius:4px;background:var(--go);color:var(--go-ink)}
.hotpill{background:var(--fame);color:#1b1400}
.reel .livepill{margin-left:0}
.rhl{font-size:24px;font-weight:800;line-height:1.12;letter-spacing:-.5px;margin:0 0 6px;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.rline{font-size:13.5px;color:#d6dae5;margin:0 0 10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reel .statchips{margin-bottom:8px}
.reel .statchips span{background:rgba(0,0,0,.45)}
.rsrc{font-size:11px;color:#aab1c2;margin-bottom:10px;font-family:var(--mono)}
.rstate{font-size:12px;font-weight:700;margin-bottom:8px;min-height:16px}
.rstate.eta{font-family:var(--mono);font-weight:600;color:#d6dae5}
.rstate.eta.hot{color:var(--dump)}
.rbtns{display:flex;gap:8px}
.rbtns .btn{flex:1;padding:13px 12px}
.rbtns .btn.big{font-size:16px;padding:15px;box-shadow:0 8px 30px rgba(57,255,136,.35)}
.rmc{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13px}
.rmc b{font-size:18px;color:var(--go)}
.reel.divider{background:radial-gradient(600px 500px at 50% 45%,rgba(255,210,63,.14),transparent 70%),#07080c;display:flex;align-items:center;justify-content:center}
.rdiv{text-align:center;padding:0 32px}
.rdiv .rhl{margin-top:6px}
.swipehint{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#d6dae5;animation:bob 1.6s infinite;pointer-events:none}

.reelmode .homebar{background:rgba(255,255,255,.95)}

.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}

.tagchip{border:1px solid rgba(108,180,255,.3);background:rgba(108,180,255,.08);color:var(--info);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}

.mover{display:grid;grid-template-columns:20px 52px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:18px;background:var(--panel);cursor:pointer}

.mright{display:flex;flex-direction:column;align-items:flex-end;gap:2px}

.simnote{margin:8px 0 0;font-size:11px}
/* ---------- electric layer: live tape, flashes, rugs ---------- */
.tape{display:flex;gap:6px;overflow:hidden;margin:0 -16px 14px;padding:0 16px;height:30px;align-items:center;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.tchip{flex-shrink:0;border:0;border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap;animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
.tchip.buy{background:rgba(57,255,136,.14);color:var(--go)}
.tchip.sell{background:rgba(255,77,141,.14);color:var(--dump)}
.tchip.big{box-shadow:0 0 0 1px currentColor,0 0 14px currentColor}
.tchip.rug{background:var(--dump);color:#1a0610;animation:tin .35s cubic-bezier(.2,1.4,.4,1),strobe .5s 3}
.tchip.raid{background:var(--go);color:var(--go-ink)}
@keyframes tin{from{transform:translateX(-40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes strobe{50%{filter:brightness(1.8)}}
.mc.fu,.num.fu{animation:fu .5s}
.mc.fd,.num.fd{animation:fd .5s}
@keyframes fu{0%{color:#fff;text-shadow:0 0 10px var(--go);background:rgba(57,255,136,.35)}100%{background:transparent}}
@keyframes fd{0%{color:#fff;text-shadow:0 0 10px var(--dump);background:rgba(255,77,141,.35)}100%{background:transparent}}
.card .mc{border-radius:4px;padding:0 2px}
.cspark{display:inline-flex;align-items:center;margin-left:auto;margin-right:8px}
.cspark svg{width:56px;height:20px}
.tag.rug{background:var(--dump);color:#1a0610;font-weight:700}
.tag.pump{background:rgba(57,255,136,.18);color:var(--go);animation:strobe 1s infinite}
.card.rugged{background:linear-gradient(120deg,rgba(255,77,141,.12),var(--panel) 60%)}
.card.rugnow{animation:rugshake .5s 2;border-color:var(--dump)}
@keyframes rugshake{0%,100%{transform:none}20%{transform:translate(-6px,2px) rotate(-1.5deg)}40%{transform:translate(6px,-2px) rotate(1.5deg)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.rugflash{position:absolute;inset:0;z-index:47;pointer-events:none;border-radius:inherit;opacity:0}
.rugflash.go{animation:rugfl .9s}
.rugflash.go.pumpfl{animation:pumpfl .7s}
@keyframes rugfl{0%{opacity:1;box-shadow:inset 0 0 120px 30px rgba(255,40,100,.75)}100%{opacity:0;box-shadow:inset 0 0 0 0 rgba(255,40,100,0)}}
@keyframes pumpfl{0%{opacity:1;box-shadow:inset 0 0 90px 16px rgba(57,255,136,.45)}100%{opacity:0}}
.screen.quake .scroller{animation:rugshake .45s 2}
.livehead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.livehead .lp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--dump)}
.livehead .lp i{width:7px;height:7px;border-radius:50%;background:var(--dump);animation:pulse 1.2s infinite}
.livehead .lchg{font-family:var(--mono);font-size:12px;font-weight:700}
.livehead .tps{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:auto}
.chseg{display:inline-grid;grid-template-columns:1fr 1fr;padding:2px;border-radius:9px;background:rgba(118,118,128,.18)}
.chseg button{border:0;background:none;border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:600;color:var(--mute)}
.chseg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
#kmc{border-radius:5px;padding:0 3px;margin-left:-3px}
.tbl tr.nr td{animation:nr 1s}
.tbl tr.nr.s td{animation:nrs 1s}
@keyframes nr{0%{background:rgba(57,255,136,.28)}100%{background:transparent}}
@keyframes nrs{0%{background:rgba(255,77,141,.28)}100%{background:transparent}}
.mover.rugged{box-shadow:inset 0 0 0 1px rgba(255,77,141,.45)}

/* ---------- A+ pass: logo menu, pinned tape ---------- */
.brandbtn{border:0;background:none;padding:4px 6px 4px 0;display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.brandbtn svg{color:var(--mute)}
.navbar .tape{grid-column:1/-1;margin:6px -16px 0;height:28px}
.card.pressed{transform:scale(.97);transition:transform .15s}

/* ---------- A+ pass: price-first coin page ---------- */
.phead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.phead img{width:40px;height:40px;border-radius:11px;object-fit:cover;flex-shrink:0}
.phtk{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.3px;line-height:1;display:flex;align-items:center;gap:8px}
.phcat{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.phnm{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pricehero{margin-bottom:6px}
.bigprice{font-family:var(--body);font-weight:800;font-size:46px;letter-spacing:-1.6px;line-height:1.02;font-variant-numeric:tabular-nums;margin-top:2px;border-radius:8px}
.bigprice.fu{animation:bfu .7s}.bigprice.fd{animation:bfd .7s}
@keyframes bfu{0%{color:var(--go);text-shadow:0 0 22px rgba(57,255,136,.6)}100%{color:var(--fg)}}
@keyframes bfd{0%{color:var(--dump);text-shadow:0 0 22px rgba(255,77,141,.6)}100%{color:var(--fg)}}
.pchg{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-height:20px}
.chartwrap{margin:6px -16px 0;height:268px;touch-action:pan-y;cursor:crosshair}
.chartwrap canvas{width:100%;height:100%;display:block}
.chartbar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.chartbar .lp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--dump)}
.chartbar .lp i{width:7px;height:7px;border-radius:50%;background:var(--dump);animation:pulse 1.2s infinite}
.chartbar .tps{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.chartbar .chseg{margin-left:auto}
.chseg button{font-family:var(--mono);font-size:11px;padding:4px 12px}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv3 div{background:var(--panel);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.kv3 span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.kv3 b{font-family:var(--mono);font-size:15px;margin-top:2px}
.mdet{background:var(--panel);border-radius:22px;margin-bottom:12px;overflow:hidden}
.mdet summary{list-style:none;display:grid;grid-template-columns:76px 1fr 18px;gap:12px;align-items:center;padding:10px;cursor:pointer}
.mdet summary::-webkit-details-marker{display:none}
.mdet summary img{width:76px;height:52px;border-radius:12px;object-fit:cover}
.mds{display:flex;flex-direction:column;gap:2px;min-width:0}
.mds b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mdet .chev{color:var(--mute);transition:transform .25s}
.mdet[open] .chev{transform:rotate(180deg)}
.mdet[open] summary .note{display:none}
.mdet .mcard{margin:0;border-radius:0;background:transparent}

/* ---------- A+ pass: one-thumb trade tray ---------- */
.tray{padding-bottom:18px}
.trhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.trhead img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.trtk{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.trmc{font-size:12px;color:var(--mute);margin-top:3px}
.trside{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:14px;background:rgba(118,118,128,.18);margin-bottom:14px}
.trside button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;color:var(--mute)}
.trside button[data-side="buy"][aria-pressed="true"]{background:var(--go);color:var(--go-ink)}
.trside button[data-side="sell"][aria-pressed="true"]{background:var(--dump);color:#1a0610}
.trside button:disabled{opacity:.35;cursor:not-allowed}
.amtwrap{display:flex;align-items:baseline;justify-content:center;gap:2px;margin:2px 0 12px;font-weight:800;font-size:56px;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.amtwrap span{color:var(--mute);font-size:40px}
.amtwrap .amtpct{color:var(--fg);font-size:56px}
.amtin{background:none;border:0;outline:none;width:5.2ch;text-align:left;font:inherit;color:var(--fg);padding:0;letter-spacing:inherit}
.trchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.trchips.four{grid-template-columns:repeat(4,1fr)}
.trchips button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:9px 0;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--mute)}
.trchips button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:rgba(255,255,255,.1)}
.trest{text-align:center;font-size:13px;color:var(--mute);min-height:20px;margin-bottom:12px}
.trest b{color:var(--fg)}
.slide{--p:0;position:relative;height:64px;border-radius:999px;background:rgba(57,255,136,.12);border:1px solid rgba(57,255,136,.35);overflow:hidden;user-select:none;-webkit-user-select:none}
.slide.sell{background:rgba(255,77,141,.12);border-color:rgba(255,77,141,.4)}
.slfill{position:absolute;left:0;top:0;bottom:0;width:60px;border-radius:999px;background:linear-gradient(90deg,rgba(57,255,136,.25),rgba(57,255,136,.55))}
.slide.sell .slfill{background:linear-gradient(90deg,rgba(255,77,141,.25),rgba(255,77,141,.55))}
.sllbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;font-weight:700;font-size:15px;opacity:calc(1 - var(--p)*1.4);background:linear-gradient(90deg,var(--fg) 0%,var(--mute) 50%,var(--fg) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.knob{position:absolute;left:4px;top:4px;width:56px;height:54px;border-radius:999px;border:0;background:var(--go);color:var(--go-ink);display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 6px 18px rgba(57,255,136,.35);cursor:grab}
.slide.sell .knob{background:var(--dump);color:#1a0610;box-shadow:0 6px 18px rgba(255,77,141,.35)}
.slide.drag .knob{cursor:grabbing;transform-origin:center}
.slide.dis{opacity:.4}
.slide.dis .sllbl{animation:none}
.slide.nope{animation:rugshake .35s}
.trcash{text-align:center;margin:10px 0 0}
.trdone{text-align:center;padding:4px 0 12px}
.trdone .tick{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--go);color:var(--go-ink);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.trdone.sell .tick{background:var(--dump);color:#1a0610}
.trdone h3{font-size:20px;font-weight:800;letter-spacing:-.3px}
.trdone .note{margin:4px 0 0}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.poscard{display:grid;grid-template-columns:1fr 1.3fr .9fr;gap:8px;background:var(--panel2);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.poscard div{display:flex;flex-direction:column;min-width:0}
.poscard span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.poscard b{font-size:15px;margin-top:2px;white-space:nowrap}
.poscard small{font-size:11px;opacity:.85}
.trbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- A+ pass: strict colour system ----------
   green = up / buy · pink = down / sell / rug · gold = Hall of Fame · everything else is greyscale */
:root{--info:#c9cedb;--n1:rgba(255,255,255,.06);--n2:rgba(255,255,255,.14)}
.brand b{color:var(--mute)}
.pill .dotg{background:var(--fg);box-shadow:none}
.tabbar button[aria-current="page"]{color:var(--fg)}
.fab{color:var(--fg)}
.chip[aria-pressed="true"],.opt[aria-pressed="true"],.playbtn[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--n2)}
.input:focus{border-color:var(--fg)}
:focus-visible{outline-color:var(--fg)}
a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:2px}
.tag.career,.tag.relic,.tag.vault,.tag.fresh,.tag.lic,.tag.you{background:none;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.tagchip{border-color:var(--line);background:var(--n1);color:var(--fg)}
.thesis{background:var(--n1);border-color:var(--line)}
.thesis .eyebrow{color:var(--mute)!important}
.statchips span{background:var(--n1);color:var(--fg);border-color:var(--line)}
.card .sline,.sb .sc{color:var(--fg);text-shadow:none}
.sb .clk{color:var(--mute);text-shadow:none}
.bar i{background:var(--fg)}
.bar.full i{background:var(--fame)}
.koth .bar i{background:var(--fame)}
.livedot{background:var(--fg);animation:pulsew 1.6s infinite}
@keyframes pulsew{0%{box-shadow:0 0 0 0 rgba(242,244,249,.5)}70%{box-shadow:0 0 0 10px rgba(242,244,249,0)}100%{box-shadow:0 0 0 0 rgba(242,244,249,0)}}
.trendteaser{border-color:var(--line);background:var(--panel)}
.trendteaser .tt-go{color:var(--fg)}
.chartbar .lp,.livehead .lp{color:var(--fg)}
.chartbar .lp i,.livehead .lp i{background:var(--fg)}
.livepill{background:var(--fg);color:#000}
.newpill{background:var(--fg);color:#000}
.hotpill{background:var(--n2);color:var(--fg)}
.buzzico{color:var(--fg)}
.bnum{color:var(--fg)}
.eta.hot,.rstate.eta.hot{color:var(--fg)}
.wtype{color:var(--mute)}
.verified{background:var(--fg)}
.sig{color:var(--mute)}
.royalty{background:var(--n1);border-color:var(--line)}
.rrow b{color:var(--fg)}
.flash.launch{background:var(--n2);color:var(--fg)}
.toast .ico{border-color:var(--line);color:var(--fg)}
.toast.fame .ico{border-color:var(--fame);color:var(--fame)}
.toast.warn .ico{border-color:var(--dump);color:var(--dump)}
.rival.cur{box-shadow:inset 0 0 0 1px var(--fg)}
.msg.me{background:var(--n2)}
.tbl .who .dot{opacity:.9}

/* ---------- A+ pass: calm three-row cards ---------- */
.card.c3{grid-template-columns:60px 1fr;gap:12px;padding:12px 12px 12px 14px;border:0;position:relative;overflow:hidden;align-items:start;transition:box-shadow .3s,background .3s}
.card.c3>img,.card.c3 .lthumb{width:60px;height:60px;border-radius:14px}
.card.c3 .lthumb span{font-size:7.5px}
.card.c3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .3s}
.card.c3.e-pump::before{background:var(--go)}
.card.c3.e-rug::before{background:var(--dump)}
.card.c3.e-hof::before{background:var(--fame)}
.card.c3.e-rug{background:linear-gradient(90deg,rgba(255,77,141,.07),var(--panel) 45%)}
.card.c3.e-pump{background:linear-gradient(90deg,rgba(57,255,136,.06),var(--panel) 45%)}
.card.c3.mine{box-shadow:none}
.card.c3 .ci{gap:0}
.r1{display:flex;align-items:baseline;gap:8px;min-width:0}
.tk3{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--fg);flex-shrink:0}
.mine3{display:none;width:6px;height:6px;border-radius:50%;background:var(--fg);flex-shrink:0;align-self:center;margin-left:-3px}
.card.mine .mine3{display:inline-block}
.hl3{font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.st3{font-size:10.5px;font-weight:700;flex-shrink:0;color:var(--mute)}
.e-pump .st3{color:var(--go)}.e-rug .st3{color:var(--dump)}.e-hof .st3{color:var(--fame)}
.sp3{height:30px;margin:6px 0 4px}
.sp3 svg{width:100%;height:100%;display:block}
.r3{display:flex;align-items:center;gap:8px;font-size:12px}
.r3 .mc{font-size:15px;font-weight:700;color:var(--fg);background:none;padding:0;border-radius:0}
.r3 .chg{font-size:12px;font-weight:600}
.pb3{display:flex;align-items:center;gap:6px;margin-left:auto;width:42%;min-width:90px}
.pb3 .bar{flex:1;height:3px;margin:0}
.pb3 .pg{font-size:10.5px;color:var(--mute);width:28px;text-align:right}
.card.c3 .mc.fu{animation:tfu .7s}.card.c3 .mc.fd{animation:tfd .7s}
@keyframes tfu{0%{color:var(--go)}100%{color:var(--fg)}}
@keyframes tfd{0%{color:var(--dump)}100%{color:var(--fg)}}
.card.c3.bump{animation:none;border:0;box-shadow:inset 0 0 0 1px rgba(57,255,136,.35)}
.card.c3.bump.s{box-shadow:inset 0 0 0 1px rgba(255,77,141,.35)}
.card.c3.enter{animation:cin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes cin{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.card.c3.rugnow{animation:rugshake .5s 2}
.list{gap:6px}

/* ---------- A+ pass: typography discipline ---------- */
.large{font-size:26px;letter-spacing:-.4px;margin:4px 0 2px}
.lede{font-size:13px;margin-bottom:12px}
.headline{font-size:22px}

/* ---------- A+ pass: signature moments ---------- */
.btn.fame{background:var(--fame);color:#1b1400}
.cine{position:absolute;inset:0;z-index:56;display:flex;align-items:center;justify-content:center;animation:fade .25s}
.cine.dim{background:rgba(5,6,8,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cine.gold{background:radial-gradient(500px 420px at 50% 40%,rgba(255,210,63,.22),rgba(5,6,8,.78) 70%)}
.cine.out{animation:fadeo .38s forwards}
@keyframes fadeo{to{opacity:0}}
.lm{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.lm img{width:132px;height:132px;border-radius:30px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 20px 60px rgba(57,255,136,.35);animation:flyup .75s cubic-bezier(.2,1.3,.4,1)}
.lmtk{font-family:var(--display);font-weight:900;font-size:44px;letter-spacing:.5px;animation:pop .5s .35s both cubic-bezier(.2,1.6,.4,1)}
.lmsub{color:var(--mute);font-size:14px;animation:fade .4s .6s both}
.lmring{position:absolute;left:50%;top:66px;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid var(--go);opacity:0;animation:ring 1.1s .45s cubic-bezier(.1,.7,.3,1)}
.lmring.r2{animation-delay:.6s;border-color:var(--fg)}
@keyframes flyup{from{transform:translateY(420px) scale(.35) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(3.2)}}
.crack{position:absolute;inset:0;z-index:57;pointer-events:none;animation:crackout 2s forwards}
.crack svg{width:100%;height:100%}
.crack path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 4px rgba(255,77,141,.9));animation:draw .28s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crackout{0%,55%{opacity:1}100%{opacity:0}}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plq{position:relative;width:calc(100% - 40px);border-radius:28px;padding:16px;background:linear-gradient(180deg,rgba(255,210,63,.16),rgba(16,19,27,.96) 45%);border:1px solid rgba(255,210,63,.5);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,210,63,.18);text-align:center;animation:plqdrop .8s cubic-bezier(.25,1.5,.45,1)}
.plq img{width:100%;aspect-ratio:720/420;border-radius:18px;object-fit:cover;display:block;margin:10px 0 12px}
.plq h3{font-family:var(--display);font-weight:900;font-size:36px;color:var(--fame);line-height:1;letter-spacing:.4px}
.plq p{margin:6px 0 12px;font-weight:600;font-size:14px}
.plqrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.plqrow span{display:flex;flex-direction:column;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.plqrow b{color:var(--fg);font-size:14px;text-transform:none;letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes plqdrop{0%{transform:translateY(-120%) rotate(-4deg)}60%{transform:translateY(4%) rotate(1deg)}100%{transform:none}}

/* ---------- A+ pass: social layer ---------- */
.social{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mute);min-height:24px;flex-wrap:nowrap;overflow:hidden}
.avs{display:flex;flex-shrink:0}
.av{width:24px;height:24px;border-radius:50%;background:#262c3b;color:#c9cedb;border:2px solid var(--bg);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;font-weight:700;margin-left:-7px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.av:first-child{margin-left:0}
.av.me{background:var(--fg);color:#000}
.av.sm{width:18px;height:18px;font-size:7px;margin:0 4px 0 0;border:0;vertical-align:-4px;animation:none}
.sbuy{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.swatch{margin-left:auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.swatch b{color:var(--fg)}

/* ---------- A+ pass: rugged tombstone ---------- */
.tomb{border-radius:20px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,77,141,.12),var(--panel) 60%);border:1px solid rgba(255,77,141,.35);animation:fade .4s}
.tombhd{display:flex;align-items:center;gap:10px;color:var(--dump)}
.tombhd div{display:flex;flex-direction:column}
.tombhd b{color:var(--fg);font-size:15px}
.tombhd span{font-family:var(--mono);font-size:12px;font-weight:700}
.tombrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 8px}
.tombrow span{display:flex;flex-direction:column;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.tombrow b{font-size:14px;color:var(--fg);margin-top:2px;text-transform:none}
.tombrow b.down{color:var(--dump)}
.tombwho{font-size:12px;color:var(--mute);line-height:1.8}

/* ---------- A+ pass: Lock Screen Live Activity preview ---------- */
.lock{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;padding:70px 12px 30px;color:#fff;animation:lockin .45s cubic-bezier(.2,.9,.3,1)}
.lock.out{animation:lockout .42s forwards cubic-bezier(.5,0,.8,.4)}
@keyframes lockin{from{transform:translateY(-100%)}to{transform:none}}
@keyframes lockout{to{transform:translateY(-100%)}}
.lkbg{position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 380px at 30% 20%,#2b3550,transparent 70%),radial-gradient(420px 420px at 80% 80%,#3a1f33,transparent 70%),#0b0d14}
.lktop{text-align:center;margin-bottom:auto}
.lkdate{font-size:17px;font-weight:600;opacity:.85}
.lktime{font-size:92px;font-weight:700;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.lkacts{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lka{border-radius:26px;padding:12px 14px;background:rgba(28,30,38,.62);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1)}
.lkr{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}
.lkr img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.lkm{display:flex;flex-direction:column;min-width:0}
.lkm b{font-family:var(--mono);font-size:14px}
.lkm span{font-size:11px;color:rgba(255,255,255,.6)}
.lkv{display:flex;flex-direction:column;align-items:flex-end}
.lkv b{font-size:17px}
.lkv span{font-size:12px;font-weight:700}
.lksp{height:30px;margin:8px 0 6px}
.lksp svg{width:100%;height:100%;display:block}
.lkal{font-size:12px;font-weight:700;color:var(--dump);margin-bottom:6px;animation:strobe 1s 2}
.lkal.hof{color:var(--fame)}
.lkpb{display:flex;align-items:center;gap:8px;font-size:10.5px;color:rgba(255,255,255,.6)}
.lkpb .bar{flex:1;height:3px}
.lkunlock{border:0;background:none;color:rgba(255,255,255,.75);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px}
.lkunlock span{width:138px;height:5px;border-radius:3px;background:#fff}

/* ---------- A+ pass: loading skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:skel 1.2s linear infinite}
@keyframes skel{to{background-position:-200% 0}}
.skc{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:12px;border-radius:18px;margin-bottom:6px;background:var(--panel)}
.skc .a{width:60px;height:60px;border-radius:14px;display:block}
.skc .b{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.skc .l1{height:11px;width:70%;border-radius:6px;display:block}
.skc .l2{height:24px;width:100%;border-radius:6px;display:block}
.skc .l3{height:11px;width:45%;border-radius:6px;display:block}
/* =====================================================================
   v2 DESIGN SYSTEM — "billion-dollar" pass
   Inter / Inter Tight · light by default · flat poster art · one accent per meaning
   ===================================================================== */
body{--display:"Inter Tight","Inter",-apple-system,system-ui,sans-serif;--body:"Inter",-apple-system,system-ui,sans-serif;--mono:"Inter",-apple-system,system-ui,sans-serif}
.num,.mono,.tk,.tkm,.tk3,.tk4{font-feature-settings:"tnum" 1}
.eyebrow{font-weight:600;letter-spacing:.5px}
.brand{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:-.6px}
.large,.lhead h2,.headline,.rhl{font-family:var(--display);letter-spacing:-.6px}
.bigprice{font-family:var(--display);font-weight:800;font-size:50px;letter-spacing:-2.2px}
.tkm,.tk,.tk3,.phtk,.trtk,.lmtk,.plq h3,.koth h2{font-family:var(--display)}
.phtk{font-size:19px;font-weight:800;letter-spacing:-.3px}
.trtk{font-size:21px;font-weight:800;letter-spacing:-.3px}

/* light tokens */
body.lt{color-scheme:light;--bg:#ffffff;--stage:#e9ebee;--panel:#f4f5f7;--panel2:#e9ebef;--line:#e8eaee;--fg:#0a0b0d;--mute:#5f6672;--dim:#9aa0aa;
  --go:#00a63e;--go-ink:#ffffff;--dump:#e5383b;--fame:#b7860b;--info:#0a0b0d;--n1:rgba(10,11,13,.04);--n2:rgba(10,11,13,.08);
  --glass:rgba(255,255,255,.86);--glass-hi:rgba(255,255,255,.9);--glass-brd:rgba(10,11,13,.08);background:#e9ebee;color:var(--fg)}
/* surfaces that stay dark even in light mode (immersive media, lock screen, overlays) */
.lt .reel,.lt #reelHead,.lt .lock,.lt .cine,.lt .island,.lt .lthumb,.lt .sb,.lt .sharecard,.lt .mart .sb{--bg:#07080c;--panel:#10131b;--panel2:#171b26;--line:#232939;--fg:#f2f4f9;--mute:#aab1c2;--dim:#5d6479;--go:#39ff88;--go-ink:#03140a;--dump:#ff4d8d;--fame:#ffd23f;--n1:rgba(255,255,255,.06);--n2:rgba(255,255,255,.14);--glass:rgba(30,34,47,.74);--glass-brd:rgba(255,255,255,.11);--glass-hi:rgba(255,255,255,.16);color:var(--fg)}
.lt .device{box-shadow:0 0 0 1px #b9bdc4,0 40px 90px rgba(10,11,13,.22)}
.lt .caption{color:#8b919c}.lt .caption b{color:#5f6672}
.lt .screen{background:var(--bg)}
.lt .screen::after{background:linear-gradient(0deg,rgba(255,255,255,.97),rgba(255,255,255,0));height:120px}
.lt .reelmode::after{display:none}
.lt .statusbar{color:#0a0b0d}
.lt .statusbar [fill="#fff"]{fill:#0a0b0d}.lt .statusbar [stroke]{stroke:rgba(10,11,13,.35)}.lt .statusbar [fill="rgba(255,255,255,.45)"]{fill:rgba(10,11,13,.4)}
.lt .reelmode .statusbar{color:#fff}.lt .reelmode .statusbar [fill="#fff"]{fill:#fff}.lt .reelmode .statusbar [stroke]{stroke:rgba(255,255,255,.4)}
.lt .homebar{background:#0a0b0d}.lt .reelmode .homebar{background:#fff}
.lt .navbar{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 transparent;transition:box-shadow .2s}
.lt .navbar.scrolled{box-shadow:0 1px 0 var(--line)}
.lt .pill{background:var(--panel);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.lt .backbtn{background:var(--panel);border:0;box-shadow:none}
.lt .tabbar{background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,11,13,.1)}
.lt .tabbar button{color:var(--dim)}
.lt .tabbar button[aria-current="page"]{color:var(--fg);background:var(--panel);box-shadow:none}
.lt .fab{background:#0a0b0d;color:#fff;border:0;box-shadow:0 10px 24px rgba(10,11,13,.28)}
.lt .actionbar{background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,11,13,.1)}
.lt .btn{background:var(--panel);color:var(--fg)}
.lt .btn.ghost{background:#fff;border:1px solid var(--line)}
.lt .btn.go{background:var(--go);color:#fff}
.lt .btn.dump{background:#fff;color:var(--dump);box-shadow:inset 0 0 0 1.5px var(--dump)}
.lt .btn.fame{background:var(--fame);color:#fff}
.lt .x{background:var(--panel);color:var(--mute)}
.lt .segm,.lt .subtabs,.lt .chseg,.lt .trside,.lt .bs{background:var(--panel)}
.lt .segm button[aria-pressed="true"],.lt .subtabs button[aria-pressed="true"],.lt .chseg button[aria-pressed="true"]{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(10,11,13,.12),0 0 0 .5px rgba(10,11,13,.06)}
.lt .trside button[aria-pressed="true"]{color:#fff}
.lt .modal{background:rgba(10,11,13,.32)}
.lt .sheet{background:rgba(255,255,255,.98);border:0;box-shadow:0 -10px 40px rgba(10,11,13,.18)}
.lt .grab{background:rgba(10,11,13,.16)}
.lt .toast{background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 12px 34px rgba(10,11,13,.14);color:var(--fg)}
.lt .toast .ico{background:#0a0b0d;color:#fff;border:0}
.lt .toast.warn .ico{background:var(--dump);color:#fff}
.lt .toast.fame .ico{background:var(--fame);color:#fff}
.lt .input,.lt .search{background:var(--panel)}
.lt .tbl td{border-bottom-color:var(--line)}
.lt .msg{background:var(--panel)}
.lt .msg.me{background:#0a0b0d;color:#fff}.lt .msg.me .h,.lt .msg.me .h b{color:rgba(255,255,255,.75)!important}
.lt .av{background:var(--panel2);color:var(--fg);border-color:#fff}.lt .av.me{background:#0a0b0d;color:#fff}
.lt .tchip.buy{background:rgba(0,166,62,.09)}.lt .tchip.sell{background:rgba(229,56,59,.08)}
.lt .tchip.rug,.lt .tchip.raid{color:#fff}.lt .tchip.big{box-shadow:inset 0 0 0 1px currentColor}
.lt .slide{background:rgba(0,166,62,.07);border-color:rgba(0,166,62,.28)}
.lt .slide.sell{background:rgba(229,56,59,.06);border-color:rgba(229,56,59,.3)}
.lt .slfill{background:linear-gradient(90deg,rgba(0,166,62,.10),rgba(0,166,62,.24))}
.lt .slide.sell .slfill{background:linear-gradient(90deg,rgba(229,56,59,.08),rgba(229,56,59,.22))}
.lt .knob,.lt .slide.sell .knob{color:#fff}
.lt .knob{box-shadow:0 6px 16px rgba(0,166,62,.3)}.lt .slide.sell .knob{box-shadow:0 6px 16px rgba(229,56,59,.3)}
.lt .trdone .tick{color:#fff}
.lt .trchips button{background:#fff;border-color:var(--line)}
.lt .trchips button[aria-pressed="true"]{background:#0a0b0d;color:#fff;border-color:#0a0b0d}
.lt .poscard{background:var(--panel)}
.lt .tomb{background:linear-gradient(135deg,rgba(229,56,59,.07),#fff 60%);border-color:rgba(229,56,59,.3)}
.lt .plaque{background:#fff;border:1px solid var(--line)}
.lt .tag.hof{background:rgba(183,134,11,.12)}
.lt .trendteaser{background:#fff;border:1px solid var(--line)}
.lt .lprev,.lt .wchip,.lt .simtag{background:var(--panel)}
.lt .bigprice.fu{animation:bfu .7s}.lt .rival.cur{box-shadow:inset 0 0 0 1.5px var(--fg)}
.lt .rugflash.go{animation:rugfl .9s}
.lt .card.c3.e-rug,.lt .card.c3.e-pump{background:var(--panel)}

/* ---------- board v2 ---------- */
.page.v2{padding-top:2px}
.sbar{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--panel);color:var(--mute);margin-bottom:6px;cursor:text}
.sbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;color:var(--fg)}
.sbar input::placeholder{color:var(--dim)}
.sbar:focus-within{box-shadow:inset 0 0 0 1.5px var(--fg)}
.utabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px;border-bottom:1px solid var(--line)}
.utabs::-webkit-scrollbar{display:none}
.utabs button{border:0;background:none;padding:12px 0 11px;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap;position:relative;flex-shrink:0}
.utabs button[aria-pressed="true"]{color:var(--fg)}
.utabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fg);border-radius:2px}
.trendteaser{border-radius:14px;padding:12px 14px;margin-bottom:12px}
.trendrail{margin-bottom:0}
.lhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 2px}
.lhead h2{font-size:20px;font-weight:800}
.stabs{display:flex;gap:2px}
.stabs button{border:0;background:none;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--mute)}
.stabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.koth.v2{display:block;padding:0;border-radius:20px;overflow:hidden;background:var(--panel);border:0;margin:0;cursor:pointer;transition:transform .2s}
.koth.v2:active{transform:scale(.985)}
.koth.v2 .kart{position:relative}
.koth.v2 .kart img{width:100%;height:auto;aspect-ratio:720/340;border-radius:0;object-fit:cover;display:block}
.kbadge{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.96);color:#0a0b0d;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.kbadge svg{color:#b7860b}
.kbody{padding:14px 16px 16px}
.kmeta{font-size:12px;font-weight:600;color:var(--mute)}
.koth.v2 .khl{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.18;margin:4px 0 14px;white-space:normal;-webkit-line-clamp:2}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kstats span{display:flex;flex-direction:column}
.kstats b{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--fg)}
.kstats small{font-size:11.5px;color:var(--mute);margin-top:1px}
.kprog{display:flex;align-items:center;gap:10px}
.kprog .bar{flex:1;height:6px;border-radius:3px;background:var(--panel2)}
.koth.v2 .kprog .bar i{background:var(--fame)}
.kpct{font-size:12px;font-weight:700;color:var(--fame);white-space:nowrap}
.list.v2{gap:0}
.card.c4{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;margin:0 -16px;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;position:relative;overflow:visible;transition:background .25s}
.card.c4:last-child{border-bottom:0}
.card.c4:hover{background:var(--n1)}
.card.c4 img{width:auto;height:auto}
.th4{position:relative;width:52px;height:52px;align-self:start}
.th4>img,.th4 .lthumb{width:52px!important;height:52px!important;border-radius:12px;display:block;object-fit:cover}
.th4 .lthumb span{font-size:7px}
.card.c4 .mine3{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--fg);border:2px solid var(--bg);margin:0;display:none}
.card.c4.mine .mine3{display:block}
.ci4{min-width:0;display:flex;flex-direction:column;gap:3px}
.hl4{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.15px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta4{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.meta4>span+span::before{content:"·";margin-right:6px;color:var(--dim)}
.meta4 .st3:empty{display:none}
.meta4 .st3{font-weight:700}
.tk4{font-weight:700;color:var(--fg)}
.pb4{display:flex;align-items:center;gap:8px;margin-top:5px}
.pb4 .bar{flex:1;height:3px;max-width:150px;background:var(--panel2)}
.pb4 .pg{font-size:11px;color:var(--dim)}
.rt4{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:82px}
.sp4{width:64px;height:22px;display:block}
.sp4 svg{width:100%;height:100%;display:block}
.rt4 .mc{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--fg);background:none;padding:0}
.pill4{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;line-height:1.2}
.pill4.up{background:rgba(0,166,62,.1);color:var(--go)}.pill4.down{background:rgba(229,56,59,.1);color:var(--dump)}
body:not(.lt) .pill4.up{background:rgba(57,255,136,.12)}body:not(.lt) .pill4.down{background:rgba(255,77,141,.12)}
.card.c4.e-rug{background:linear-gradient(90deg,rgba(229,56,59,.07),transparent 70%)}
.card.c4.e-pump{background:linear-gradient(90deg,rgba(0,166,62,.06),transparent 70%)}
.card.c4.bump{background:linear-gradient(90deg,rgba(0,166,62,.07),transparent 75%)}
.card.c4.bump.s{background:linear-gradient(90deg,rgba(229,56,59,.07),transparent 75%)}
.card.c4.enter{animation:cin .5s cubic-bezier(.2,.9,.3,1)}
.card.c4.rugnow{animation:rugshake .5s 2}
.card.c4 .mc.fu{animation:tfu .7s}.card.c4 .mc.fd{animation:tfd .7s}
.navbar .tape{margin-top:8px}
.chartbar{gap:8px}
#ctseg button{padding:4px 9px;display:inline-flex;align-items:center}
.chartbar #ctseg{margin-left:auto}.chartbar #chseg{margin-left:0}

/* dump note: a line of text, not a card */
.dnote{display:inline-flex;align-items:center;gap:7px;margin-top:6px;padding:0;border:0;background:none;color:var(--mute);font-size:13px;font-weight:500;cursor:pointer}
.dnote i{width:6px;height:6px;border-radius:50%;background:var(--dump);flex-shrink:0}
.dnote b{color:var(--dump);font-weight:700}
.dnote svg{color:var(--dim)}
.dnote:hover span{text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px}
.dl{margin:0 0 6px}
.dl>div{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl>div:last-child{border-bottom:0}
.dl dt{color:var(--mute)}.dl dd{margin:0;font-weight:600}
/* Hall pot */
.potline{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:4px 10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.potline:empty{display:none}
.potline .pk{color:var(--mute);font-weight:600}
.potline>b{font-size:15px;color:var(--fame)}
.potline .pv{grid-column:1/-1;color:var(--mute);line-height:1.45}
.potline .pv b{color:var(--fg)}
.potnote{display:inline-block;margin-top:4px;font-size:12px;color:var(--mute)}
.potnote.warn{color:var(--dump);font-weight:600}
.trest{line-height:1.5}
/* tester layer */
.navbar .r{display:flex;align-items:center;gap:6px}
.fbbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--panel);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.misrow{width:100%;display:flex;align-items:center;gap:10px;margin:8px 0 10px;padding:11px 14px;border-radius:14px;border:1px dashed var(--line);background:none;color:var(--mute);font-size:13px;text-align:left}
.misrow b{color:var(--fg)}
.misrow svg{margin-left:auto;color:var(--dim)}
.mdots{display:inline-flex;gap:4px}.mdots i{width:8px;height:8px;border-radius:50%;background:var(--panel2)}.mdots i.on{background:var(--go)}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.mlist b{display:block;font-size:15px}.mlist small{display:block;color:var(--mute);font-size:13px;margin-top:2px;line-height:1.4}
.mck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.mlist li.done .mck{background:var(--go);box-shadow:none}
